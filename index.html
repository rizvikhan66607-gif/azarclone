<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azar Clone</title>
<style>
body,html{margin:0;padding:0;background:#000;width:100%;height:100%}
#root{width:100vw;height:100vh}
#btns{position:fixed;bottom:15px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:9999}
#btns button{padding:12px 20px;border:0;border-radius:25px;font-size:16px;font-weight:bold;color:#fff}
#nextBtn{background:#ff3b30}
#chatBtn{background:#007aff}
</style>
</head>
<body>
<div id="root"></div>
<div id="btns">
<button id="nextBtn">Next ⏭️</button>
<button id="chatBtn">Chat 💬</button>
</div>

<script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
<script>
const appID = 1089853157;

// 👇👇👇 BAS YAHAN PASTE KARNA HAI - AUR KAHIN NAHI 👇👇👇
const serverSecret = "a393a5dfade550a6a647ad24118c4055";
// 👆👆👆 UPAR WALI LINE ME - YAHAN_PASTE_KARO ko delete karke apna secret daal de 👆👆👆

const roomID = "azar-room-1";
const userID = "user_" + Math.floor(Math.random()*100000);
const userName = "User_" + Math.floor(Math.random()*100000);
const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(appID, serverSecret, roomID, userID, userName);

const zp = ZegoUIKitPrebuilt.create(kitToken);
zp.joinRoom({
  container: document.querySelector("#root"),
  scenario: { mode: ZegoUIKitPrebuilt.OneONoneCall },
  showPreJoinView: false,
  showScreenSharingButton: false,
});

document.getElementById("nextBtn").onclick = function(){
  location.reload();
};
document.getElementById("chatBtn").onclick = function(){
  alert("Chat jaldi aa raha hai bhai!");
};
</script>
</body>
</html>
